# Local stack: Kafka (KRaft, no ZooKeeper) + OTel Collector + Jaeger + our services.
#   docker compose up -d --build
#   docker compose --profile demo run --rm simagent
#   open http://localhost:16686 (Jaeger) and http://localhost:8081/v1/agents
x-app-env: &app-env
  KAFKA_BROKERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"

services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9094:9094"] # for clients on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # KRaft: this node is its own controller quorum
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init: # create topics explicitly; never rely on auto-create for partition counts
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in agent.events agent.control agent.events.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 6 --replication-factor 1
        done

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    ports: ["16686:16686"]

  ingest:
    build: .
    image: agent-event-bus:dev
    command: ["ingest"]
    environment: *app-env
    ports: ["8080:8080"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }

  processor:
    build: .
    image: agent-event-bus:dev
    command: ["processor"]
    environment:
      <<: *app-env
      POLICY_MAX_GUARD_DENIALS: 3
    ports: ["8081:8081"]
    restart: on-failure # a handler error exits; restart resumes from the last commit
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }

  simagent:
    image: agent-event-bus:dev
    profiles: [demo]
    command: ["simagent", "-ingest", "http://ingest:8080"]
    environment: *app-env
    depends_on: [ingest]
